  <text x="36" y="54" text-anchor="start" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">Building in public</text>
<text x="36" y="104" text-anchor="start" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">its Erfoon :\</text>
<text x="36" y="142" text-anchor="start" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">I'm currently learning and developing.</text>
